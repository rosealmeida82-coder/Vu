name: Criar EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pygame pyinstaller
      - run: python -m PyInstaller --onefile --noconsole --name FNAF_Treslands FNAF_Treslands.py
      - uses: actions/upload-artifact@v4
        with:
          name: FNAF_Treslands_exe
          path: dist/FNAF_Treslands.exe
